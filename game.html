<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games | Nguyen Tuan Anh</title>
    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-grid min-h-screen flex flex-col">
    <nav class="p-4 sm:p-6">
        <a href="index.html" class="flex items-center gap-2 text-tech-muted hover:text-tech-accent transition-colors font-bold uppercase tracking-widest text-xs sm:text-sm">
            <i data-lucide="external-link" class="w-4 h-4 rotate-180"></i>
            Back to Portfolio
        </a>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12 space-y-8 sm:space-y-12">
        <header class="text-center space-y-4">
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tighter">My <span class="text-tech-accent">Games</span></h1>
            <p class="text-sm sm:text-base text-tech-muted">A collection of worlds I've explored and enjoyed.</p>
        </header>

        <div class="grid md:grid-cols-2 gap-5 sm:gap-8">
            <!-- Game 1 -->
            <div class="tech-card group cursor-pointer" onclick="showGame('/assets/genshin.png')">
                <div class="relative overflow-hidden rounded-xl h-48 mb-6">
                    <img src="/assets/genshin.png" alt="Genshin Impact" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    <div class="absolute bottom-4 left-4">
                        <h2 class="text-xl font-bold">Genshin Impact</h2>
                    </div>
                </div>
                <p class="text-sm text-tech-muted">Open-world action RPG that I spend most of my free time in.</p>
            </div>
            
            <!-- Game 2 -->
            <div class="tech-card group cursor-pointer" onclick="showGame('/assets/lienquan.png')">
                <div class="relative overflow-hidden rounded-xl h-48 mb-6">
                    <img src="/assets/lienquan.png" alt="Liên Quân Mobile" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    <div class="absolute bottom-4 left-4">
                        <h2 class="text-xl font-bold">Liên Quân Mobile</h2>
                    </div>
                </div>
                <p class="text-sm text-tech-muted">Fast-paced MOBA battles for competitive gaming sessions.</p>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="game-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 p-4 sm:p-6 backdrop-blur-sm opacity-0 transition-opacity duration-300" role="dialog" aria-modal="true" aria-label="Game image preview">
        <div class="relative flex max-h-[90vh] w-full max-w-5xl items-center justify-center">
            <button class="absolute right-2 top-2 z-10 rounded-lg bg-black/60 p-2 text-white hover:text-tech-accent" type="button" aria-label="Close image preview" onclick="hideModal()">
                <i data-lucide="sun" class="w-6 h-6 sm:w-8 sm:h-8 rotate-45"></i>
            </button>
            <img id="game-image" src="" alt="Game Zoomed" class="max-h-[85vh] max-w-full rounded-2xl border border-white/10 object-contain shadow-2xl">
        </div>
    </div>

    <footer class="p-12 text-center text-tech-muted text-xs">
        © 2026 Nguyen Tuan Anh.
    </footer>

    <script type="module" src="/src/js/main.js"></script>
    <script>
        const modal = document.getElementById('game-modal');
        const gameImage = document.getElementById('game-image');

        function showGame(src) {
            gameImage.src = src;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('overflow-hidden');
            setTimeout(() => modal.classList.add('opacity-100'), 10);
        }

        function hideModal() {
            modal.classList.remove('opacity-100');
            document.body.classList.remove('overflow-hidden');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        modal.addEventListener('click', (event) => {
            if (event.target === modal) hideModal();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modal.classList.contains('hidden')) hideModal();
        });
    </script>
</body>
</html>
